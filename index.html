    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 {
            color: #333;
        }
        .btn {
            background-color: #ff0050; /* لون تيك توك الشهير */
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #00f2fe;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في موقعي الجديد! 🎉</h1>
        <p>هذه الصفحة جاهزة الآن ومربوطة بكود البكسل لتتبع الزوار وتكبير جمهورك الإعلاني.</p>
        
        <!-- هذا هو الزر الذي يمكنك تتبعه عبر أداة تيك توك -->
        <button class="btn" id="myActionButton">اضغط هنا للتفاعل ✨</button>
    </div>
